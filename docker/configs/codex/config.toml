[tui]
status_line = ["model-with-reasoning", "project-name", "git-branch", "permissions", "approval-mode", "context-remaining", "used-tokens", "total-input-tokens", "total-output-tokens", "fast-mode", "context-window-size"]
status_line_use_colors = true
session_picker_view = "comfortable"
theme = "solarized-light"
screen_reader_detection_done = true

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4
gpt-6-astra = 2
"gpt-6.1-sol" = 4

[features]
memories = true
multi_agent_v2 = { enabled = true, max_concurrent_threads_per_session = 4 }
# Shared app-server daemon feature settings, kept in sync with attaching TUIs
# (see codex-app-server/README.md). Pinned here so replace.sh starts the
# managed daemon with them and other clients cannot flip them at runtime.
api_key_model_discovery = true
auth_elicitation = true
code_mode_host = true
mcp_oauth_refresh_coordination = false

[memories]
use_memories = true
generate_memories = true

[model_providers.openai_vanilla]
name = "OpenAI Vanilla"
base_url = "https://chatgpt.com/backend-api/codex"
wire_api = "responses"
requires_openai_auth = true

[marketplaces.openai-bundled]
source_type = "local"
source = "/home/cfd_agent/.codex/.tmp/bundled-marketplaces/openai-bundled"

[plugins."visualize@openai-bundled"]
enabled = true

[notice]
hide_rate_limit_model_nudge = true
