[project]
name = "cfdeval"
version = "0.1.0"
description = "CFD benchmark evaluation: metadata extraction, recording, format-checking, and querying"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfdeval"]

[project.scripts]
cfdeval = "cfdeval.cli:main"

[tool.uv]
package = true
